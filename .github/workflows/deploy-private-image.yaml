name: Deploy Private Nginx to K3s

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  K3S_SERVER_IP: ${{ secrets.K3S_SERVER_IP }}

jobs:
  deploy:
    name: Deploy to K3s Cluster
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K3S_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "========================================="
            echo "Deploying Private Nginx to K3s Cluster"
            echo "========================================="
            
            # Create Docker Hub pull secret
            echo "Creating Docker Hub pull secret..."
            sudo k3s kubectl delete secret dockerhub-secret --ignore-not-found
            sudo k3s kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
              --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
              --docker-email=${{ secrets.DOCKERHUB_EMAIL }}
            
            # Verify secret was created
            sudo k3s kubectl get secret dockerhub-secret
            
            # Deploy nginx from private registry
            echo "Deploying nginx from private registry..."
            
            # Create deployment YAML as a file
            cat > /tmp/nginx-deploy.yaml << 'YAML'
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: nginx-private-deployment
              labels:
                app: nginx-private
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: nginx-private
              template:
                metadata:
                  labels:
                    app: nginx-private
                spec:
                  containers:
                  - name: nginx
                    image: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-private:latest
                    imagePullPolicy: Always
                    ports:
                    - containerPort: 80
                      name: http
                    resources:
                      requests:
                        memory: "64Mi"
                        cpu: "50m"
                      limits:
                        memory: "128Mi"
                        cpu: "100m"
                  imagePullSecrets:
                  - name: dockerhub-secret
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: nginx-private-service
              labels:
                app: nginx-private
            spec:
              type: NodePort
              ports:
              - port: 80
                targetPort: 80
                nodePort: 30080
                protocol: TCP
                name: http
              selector:
                app: nginx-private
            YAML
            
            # Apply the deployment
            sudo k3s kubectl apply -f /tmp/nginx-deploy.yaml
            
            # Wait for deployment
            echo "Waiting for deployment to be ready..."
            sudo k3s kubectl rollout status deployment/nginx-private-deployment --timeout=120s
            
            # Show status
            echo ""
            echo "========================================="
            echo "Deployment Status"
            echo "========================================="
            echo ""
            echo "Pods:"
            sudo k3s kubectl get pods -l app=nginx-private -o wide
            echo ""
            echo "Services:"
            sudo k3s kubectl get svc nginx-private-service
            echo ""
            echo "Deployment:"
            sudo k3s kubectl get deployment nginx-private-deployment
            echo ""
            echo "========================================="
            echo "✅ Deployment Complete!"
            echo "========================================="
            echo ""
            NODE_PORT=$(sudo k3s kubectl get svc nginx-private-service -o jsonpath='{.spec.ports[0].nodePort}')
            echo "Access nginx at: http://<WORKER-NODE-PUBLIC-IP>:${NODE_PORT}"
