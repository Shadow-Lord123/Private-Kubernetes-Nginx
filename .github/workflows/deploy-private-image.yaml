name: Deploy Private Nginx to K3s

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  K3S_SERVER_IP: ${{ secrets.K3S_SERVER_IP }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_EMAIL: ${{ secrets.DOCKERHUB_EMAIL }}

jobs:
  deploy:
    name: Deploy to K3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup SSH
      # -----------------------------
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.K3S_SSH_PRIVATE_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write SSH private key correctly
          cat <<EOF > ~/.ssh/id_rsa
          $SSH_PRIVATE_KEY
          EOF

          chmod 600 ~/.ssh/id_rsa

          # Add server to known hosts
          ssh-keyscan -H "$K3S_SERVER_IP" >> ~/.ssh/known_hosts

          # Validate SSH key
          ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null

      # -----------------------------
      # Test SSH Connection
      # -----------------------------
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              ubuntu@$K3S_SERVER_IP \
              "echo '✅ SSH connection successful'"

      # -----------------------------
      # Deploy to K3s
      # -----------------------------
      - name: Deploy application
        run: |
          ssh ubuntu@$K3S_SERVER_IP << EOF
            set -e

            echo "=== Creating DockerHub secret ==="

            sudo k3s kubectl delete secret dockerhub-secret --ignore-not-found

            sudo k3s kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="$DOCKERHUB_USERNAME" \
              --docker-password="$DOCKERHUB_TOKEN" \
              --docker-email="$DOCKERHUB_EMAIL"

            echo "=== Deploying nginx ==="

            cat <<DEPLOY | sudo k3s kubectl apply -f -
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: nginx-private-deployment
            spec:
              replicas: 2
              selector:
                matchLabels:
                  app: nginx-private
              template:
                metadata:
                  labels:
                    app: nginx-private
                spec:
                  imagePullSecrets:
                    - name: dockerhub-secret

                  containers:
                    - name: nginx
                      image: $DOCKERHUB_USERNAME/nginx-private:latest
                      imagePullPolicy: Always

                      ports:
                        - containerPort: 80

                      resources:
                        requests:
                          memory: "64Mi"
                          cpu: "100m"
                        limits:
                          memory: "128Mi"
                          cpu: "250m"

            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: nginx-private-service
            spec:
              type: NodePort

              selector:
                app: nginx-private

              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 80
                  nodePort: 30080
            DEPLOY

            echo ""
            echo "=== Waiting for rollout ==="

            sudo k3s kubectl rollout status deployment/nginx-private-deployment --timeout=120s

            echo ""
            echo "=== Pods ==="
            sudo k3s kubectl get pods -l app=nginx-private

            echo ""
            echo "=== Services ==="
            sudo k3s kubectl get svc nginx-private-service
          EOF

      # -----------------------------
      # Verify Deployment
      # -----------------------------
      - name: Verify deployment
        run: |
          echo ""
          echo "======================================"
          echo "✅ Deployment Complete"
          echo "======================================"
          echo ""
          echo "Application URL:"
          echo "http://$K3S_SERVER_IP:30080"
          echo ""

          curl -I --max-time 10 http://$K3S_SERVER_IP:30080 || true
